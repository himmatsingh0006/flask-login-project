<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Your space · Northstar</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="dashboard-page">
  <header class="dashboard-header">
    <a class="brand" href="{{ url_for('dashboard') }}">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><path d="M16 3.5 19.7 12.3 28.5 16l-8.8 3.7L16 28.5l-3.7-8.8L3.5 16l8.8-3.7L16 3.5Z" fill="currentColor"/><circle cx="16" cy="16" r="3" fill="#fff"/></svg>
      </span>
      <span>northstar</span>
    </a>
    <form action="{{ url_for('logout') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="signout-button" type="submit">Sign out <span aria-hidden="true">↗</span></button>
    </form>
  </header>
  <main class="dashboard-main">
    <span class="eyebrow form-eyebrow"><span class="status-dot"></span> YOUR SPACE</span>
    <h1>Welcome, {{ name }}.</h1>
    <p>You’re signed in and ready for what’s next.</p>
    <div class="dashboard-card">
      <span class="dashboard-sparkle" aria-hidden="true">✳</span>
      <div><strong>A fresh page, just for you.</strong><span>Your Northstar account is set up. Take a breath, get comfortable, and make today yours.</span></div>
    </div>
  </main>
</body>
</html>
